<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SematIn</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="app-wrapper">
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </div>
        <div>
          <div class="title-row">
            <h1>SematIn</h1>
            <span id="header-version-badge" class="header-version-badge" title="Installed version">v2.0.3</span>
          </div>
          <span class="subtitle">Simpan sekali, gunakan berkali-kali</span>
        </div>
      </div>
      <button type="button" id="btn-show-add" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New
      </button>
    </header>

    <main id="view-list" class="view-section">
      <div class="search-box">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="Search templates...">
        <button type="button" id="btn-toggle-select-mode" class="btn btn-ghost btn-xs select-mode-toggle" title="Select multiple templates" aria-pressed="false">Select</button>
        <div class="sort-dropdown" id="sort-dropdown">
          <button type="button" id="btn-sort-menu" class="sort-trigger" title="Sort templates" aria-haspopup="listbox" aria-expanded="false">
            <span id="sort-label">Default</span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
      </div>

      <div class="category-tabs-wrap">
        <button type="button" id="btn-cat-scroll-left" class="cat-scroll-btn cat-scroll-left hidden" title="Scroll categories left" aria-label="Scroll categories left">
          <span class="cat-scroll-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></span>
        </button>
        <div id="category-tabs" class="category-tabs" role="tablist" aria-label="Filter template categories">
          <button type="button" role="tab" class="category-tab active" aria-selected="true"><span>All</span><span class="category-tab-count">3</span></button>
          <button type="button" role="tab" class="category-tab" aria-selected="false"><span>HR</span><span class="category-tab-count">1</span></button>
          <button type="button" role="tab" class="category-tab" aria-selected="false"><span>Layanan</span><span class="category-tab-count">1</span></button>
          <button type="button" role="tab" class="category-tab" aria-selected="false"><span>Sosial</span><span class="category-tab-count">1</span></button>
        </div>
        <button type="button" id="btn-cat-scroll-right" class="cat-scroll-btn cat-scroll-right hidden" title="Scroll categories right" aria-label="Scroll categories right">
          <span class="cat-scroll-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
        </button>
      </div>

      <div id="template-list" class="list-container">
        <div class="template-card">
          <div class="template-info">
            <div class="template-title" title="Surat Lamaran">Surat Lamaran</div>
            <div class="template-meta-row">
              <span class="template-category-badge">HR</span>
              <span class="attachment-count-badge" title="2 attached images"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>2</span>
            </div>
          </div>
          <div class="template-actions-column">
            <div class="template-actions">
              <button type="button" class="btn-use" title="Fill the active field">Use</button>
              <button type="button" class="btn-icon btn-preview-template" title="Preview template" aria-label="Preview template">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <button type="button" class="btn-icon btn-edit" title="Edit template">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
              <button type="button" class="btn-icon btn-template-more" title="More actions" aria-label="More actions" aria-haspopup="menu" aria-expanded="false">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
              </button>
            </div>
            <div class="template-excel-imports"></div>
          </div>
        </div>
        <div class="template-card">
          <div class="template-info">
            <div class="template-title" title="Balasan Pelanggan">Balasan Pelanggan</div>
            <div class="template-meta-row">
              <span class="template-category-badge">Layanan</span>
            </div>
          </div>
          <div class="template-actions-column">
            <div class="template-actions">
              <button type="button" class="btn-use" title="Fill the active field">Use</button>
              <button type="button" class="btn-icon btn-favorite-template is-favorite" title="Remove from favorites" aria-label="Remove from favorites">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              </button>
              <button type="button" class="btn-icon btn-preview-template" title="Preview template" aria-label="Preview template">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <button type="button" class="btn-icon btn-edit" title="Edit template">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
              <button type="button" class="btn-icon btn-template-more" title="More actions" aria-label="More actions" aria-haspopup="menu" aria-expanded="false">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
              </button>
            </div>
            <div class="template-excel-imports"></div>
          </div>
        </div>
        <div class="template-card">
          <div class="template-info">
            <div class="template-title" title="Caption Instagram">Caption Instagram</div>
            <div class="template-meta-row">
              <span class="template-category-badge">Sosial</span>
            </div>
          </div>
          <div class="template-actions-column">
            <div class="template-actions">
              <button type="button" class="btn-use" title="Fill the active field">Use</button>
              <button type="button" class="btn-icon btn-preview-template" title="Preview template" aria-label="Preview template">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <button type="button" class="btn-icon btn-edit" title="Edit template">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
              <button type="button" class="btn-icon btn-template-more" title="More actions" aria-label="More actions" aria-haspopup="menu" aria-expanded="false">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
              </button>
            </div>
            <div class="template-excel-imports"></div>
          </div>
        </div>
      </div>

      <footer class="list-footer">
        <button type="button" id="btn-support-trakteer" class="footer-trakteer-btn" title="Dukung SematIn di Trakteer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          <span>Trakteer Saya</span>
        </button>
        <div id="template-pagination" class="template-pagination hidden"></div>
        <div class="settings-wrapper">
          <button type="button" id="btn-toggle-settings" class="btn-setting-icon" title="Settings" aria-haspopup="menu" aria-expanded="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </footer>
    </main>
  </div>
</body>
</html>
